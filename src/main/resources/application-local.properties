spring.cloud.gateway.server.webflux.routes[3].id=maithil-product-open
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/product/api/public/**
spring.cloud.gateway.server.webflux.routes[3].order=-1


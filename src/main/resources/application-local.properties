# ===================================================================
# SPRING CLOUD GATEWAY SERVER ROUTING (WEBFLUX STANDARD)
# ===================================================================

# --- ROUTE 0: Auth Service (Open Endpoints) ---
spring.cloud.gateway.server.webflux.routes[0].id=maithil-auth-open
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/login,/auth/admin/login,/auth/register,/auth/refresh,/auth/admin/refresh,/auth/me-open

# --- ROUTE 1: Auth Service (Secure Endpoints) ---
spring.cloud.gateway.server.webflux.routes[1].id=maithil-auth-secure
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=JwtAuth

# --- ROUTE 2: User Service (Secure Endpoints) ---
spring.cloud.gateway.server.webflux.routes[2].id=maithil-user-secure
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8084
